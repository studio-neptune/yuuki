[project]
name = "star_yuuki_bot"
version = "8.0"
description = "The perfectest LINE Group Protective BOT"
license = { text = "MPL-2.0" }
authors = [
    { name = "Neptune Studio" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "yuuki-core>=6.5,<7",
]

[project.urls]
Homepage = "https://line.starinc.xyz/star-yuuki-bot/"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Translation keys are long strings that cannot be wrapped.
"src/i18n/*" = ["E501"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.9",
]
